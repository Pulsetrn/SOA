version: 1
disable_existing_loggers: false
formatters:
  json:
    '()': app.request_logging.JsonFormatter
handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
  discard:
    class: logging.NullHandler
root:
  level: WARNING
  handlers: [console]
loggers:
  marketplace.requests:
    level: INFO
    handlers: []
    propagate: true
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn.error:
    level: INFO
    handlers: []
    propagate: true
  uvicorn.access:
    level: INFO
    handlers: [discard]
    propagate: false
