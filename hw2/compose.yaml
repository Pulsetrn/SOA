name: marketplace-hw2

services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: redgate/flyway:11.15.0
    platform: linux/amd64
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-marketplace}
      FLYWAY_USER: ${POSTGRES_USER:-marketplace}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_local}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_MIGRATION_NAMING: 'true'
      FLYWAY_CLEAN_DISABLED: 'true'
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: [migrate]
    depends_on:
      db:
        condition: service_healthy

  marketplace-api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-homework-only-change-this-secret-before-deployment}
      ORDER_OPERATION_INTERVAL_MINUTES: ${ORDER_OPERATION_INTERVAL_MINUTES:-1}
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:-marketplace}
      DB_USER: ${POSTGRES_USER:-marketplace}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_local}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  codegen:
    image: openapitools/openapi-generator-cli:v7.26.0
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace

  tests:
    build:
      context: .
      target: test
    profiles: [tools]
    environment:
      JWT_SECRET: test-only-signing-secret-at-least-32-bytes
      ORDER_OPERATION_INTERVAL_MINUTES: '1'
      DB_HOST: db-test
      DB_PORT: '5432'
      DB_NAME: marketplace_test
      DB_USER: marketplace_test
      DB_PASSWORD: marketplace_test

  db-test:
    image: postgres:17.6
    profiles: [tools]
    environment:
      POSTGRES_DB: marketplace_test
      POSTGRES_USER: marketplace_test
      POSTGRES_PASSWORD: marketplace_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20

  migrate-test:
    image: redgate/flyway:11.15.0
    platform: linux/amd64
    profiles: [tools]
    environment:
      FLYWAY_URL: jdbc:postgresql://db-test:5432/marketplace_test
      FLYWAY_USER: marketplace_test
      FLYWAY_PASSWORD: marketplace_test
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_VALIDATE_MIGRATION_NAMING: 'true'
      FLYWAY_CLEAN_DISABLED: 'true'
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: [migrate]
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  postgres-data:
