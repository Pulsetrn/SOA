name: flights-hw3

x-sentinel: &sentinel
  image: redis:7.4.2-alpine
  command: [sh, /etc/redis/start-sentinel.sh]
  depends_on:
    redis:
      condition: service_healthy
    redis-replica:
      condition: service_healthy
  healthcheck:
    test: [CMD, redis-cli, -e, -p, '26379', SENTINEL, CKQUORUM, flight-cache]
    interval: 2s
    timeout: 3s
    retries: 20

services:
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --replica-announce-ip, redis]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20

  redis-replica:
    image: redis:7.4.2-alpine
    command: [redis-server, --save, '', --appendonly, 'no', --replicaof, redis, '6379', --replica-announce-ip, redis-replica]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20

  sentinel-1:
    <<: *sentinel
    volumes:
      - ./redis:/etc/redis:ro
      - sentinel-1-data:/data

  sentinel-2:
    <<: *sentinel
    volumes:
      - ./redis:/etc/redis:ro
      - sentinel-2-data:/data

  sentinel-3:
    <<: *sentinel
    volumes:
      - ./redis:/etc/redis:ro
      - sentinel-3-data:/data

  flight-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: ${FLIGHT_DB_PASSWORD:-flight_local}
    volumes:
      - flight-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U flight -d flight']
      interval: 2s
      timeout: 3s
      retries: 30

  booking-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_local}
    volumes:
      - booking-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U booking -d booking']
      interval: 2s
      timeout: 3s
      retries: 30

  flight:
    build: .
    command: [sh, -c, 'alembic -c flight/alembic.ini upgrade head && exec python -m flight.server']
    environment:
      DATABASE_URL: postgresql+psycopg://flight:${FLIGHT_DB_PASSWORD:-flight_local}@flight-db:5432/flight
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:?Set FLIGHT_API_KEY in hw3/.env}
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: flight-cache
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
    ports:
      - '127.0.0.1:${FLIGHT_GRPC_PORT:-50051}:50051'
    depends_on:
      flight-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, flight.health]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s

  booking:
    build: .
    command: [sh, -c, 'alembic -c booking/alembic.ini upgrade head && exec uvicorn booking.main:app --host 0.0.0.0 --port 8000']
    environment:
      DATABASE_URL: postgresql+psycopg://booking:${BOOKING_DB_PASSWORD:-booking_local}@booking-db:5432/booking
      FLIGHT_TARGET: flight:50051
      FLIGHT_API_KEY: ${FLIGHT_API_KEY:?Set FLIGHT_API_KEY in hw3/.env}
      GRPC_TIMEOUT_SECONDS: ${GRPC_TIMEOUT_SECONDS:-3}
      FLIGHT_BREAKER_THRESHOLD: ${FLIGHT_BREAKER_THRESHOLD:-5}
      FLIGHT_BREAKER_COOLDOWN_SECONDS: ${FLIGHT_BREAKER_COOLDOWN_SECONDS:-15}
      FLIGHT_BREAKER_WINDOW_SECONDS: ${FLIGHT_BREAKER_WINDOW_SECONDS:-60}
    ports:
      - '127.0.0.1:${BOOKING_HTTP_PORT:-8003}:8000'
    depends_on:
      booking-db:
        condition: service_healthy
      flight:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s

volumes:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data:
  flight-data:
  booking-data:
